name: Deploy cookbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify JavaScript and recipe data
        run: |
          node --check app.js
          node --check recipes.js
          node -e "global.window={};require('./recipes.js');if(window.RECIPES.length<3)process.exit(1);for(const r of window.RECIPES){if(!r.groups.length||!r.steps.length)process.exit(1)}"
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css app.js recipes.js manifest.webmanifest sw.js icon.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
